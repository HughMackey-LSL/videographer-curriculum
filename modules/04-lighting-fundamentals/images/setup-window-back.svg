<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
<title id="title">Key + reflector + window backlight: overhead lighting plan</title><desc id="desc">One LED key in front-left, a white reflector in front-right with incoming key spill and reflected fill, and a rear window supplying separation. Arrows show direction of light, not beam width. Subject faces camera below.</desc>
<defs><marker id="key-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b45309"/></marker><marker id="fill-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1d4ed8"/></marker><marker id="back-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#15803d"/></marker><marker id="window-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0e7490"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#0f172a;font-size:18px}.label{font-weight:650}.small{font-size:14px;fill:#475569}</style>
<rect width="640" height="560" fill="#f8fafc"/><rect x="25" y="35" width="590" height="35" rx="6" fill="#e2e8f0"/><text x="45" y="59" class="small">Background / rear wall</text>
<g transform="translate(160 400) rotate(-45.000)"><rect x="-26" y="-39" width="26" height="78" rx="4" fill="#fbbf24" stroke="#b45309" stroke-width="2"/><path d="M0 -37V37" stroke="#fff" stroke-width="8"/><path d="M4 -37V37" stroke="#b45309" stroke-width="2"/></g><path d="M160 400 L296.67 263.33" fill="none" stroke="#b45309" stroke-width="4"  marker-end="url(#key-arrow)"/><text x="25" y="341" class="label">LED key + softbox</text><text x="25" y="366" class="small">Main facial light</text><path d="M160 400 L470.00 360.00" fill="none" stroke="#b45309" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#key-arrow)"/><g transform="translate(470 360) rotate(-164.346)"><rect x="-6" y="-42" width="12" height="84" rx="3" fill="#fff" stroke="#1d4ed8" stroke-width="2"/></g><path d="M470 360 L345.77 260.61" fill="none" stroke="#1d4ed8" stroke-width="3"  marker-end="url(#fill-arrow)"/><text x="468" y="440" class="label">White reflector</text><text x="468" y="463" class="small">Bounced fill</text><rect x="410" y="35" width="180" height="35" rx="3" fill="#cffafe" stroke="#0e7490" stroke-width="3"/><path d="M426 35v35m148-35v35" stroke="#0e7490" stroke-width="2"/><text x="459" y="59" class="label">Window</text><path d="M500 70 L343.99 217.34" fill="none" stroke="#0e7490" stroke-width="3"  marker-end="url(#window-arrow)"/>
<ellipse cx="320" cy="235" rx="58" ry="15" fill="#cbd5e1"/><circle cx="320" cy="240" r="31" fill="#334155"/><path d="M313 266 320 280 327 266Z" fill="#fff" stroke="#334155" stroke-width="2"/><text x="281" y="190" class="label">Subject</text><text x="114" y="246" class="small">Faces camera ↓</text>
<path d="M320 282V451" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/><path d="M320 325 A85 85 0 0 1 259.9 300.1" fill="none" stroke="#b45309" stroke-width="2"/><text x="269" y="347" class="label">≈45°</text><text x="210" y="443" class="small">Camera axis</text>
<rect x="293" y="470" width="54" height="32" rx="5" fill="#2563eb"/><rect x="310" y="452" width="20" height="20" rx="2" fill="#2563eb"/><text x="283" y="527" class="label">Camera</text><text x="25" y="551" class="small">Dashed amber = key reaching reflector; blue = bounced fill.</text></svg>